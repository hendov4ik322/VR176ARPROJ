<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Object Detection — Fixed Lines</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <div id="loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; display:flex; justify-content:center; align-items:center; z-index:9999;">
    Loading model...
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" vr-mode-ui="enabled: false">
    <a-marker type="pattern" url="pattern-LeftUp.patt" id="marker1"></a-marker>
    <a-marker type="pattern" url="pattern-RightDown.patt" id="marker2"></a-marker>
    <a-plane id="field" color="lime" opacity="0.2" rotation="-90 0 0" visible="false"></a-plane>
    <a-entity camera></a-entity>
    <a-entity id="boxes"></a-entity>
  </a-scene>

  <script>
    document.querySelector('a-scene').addEventListener('loaded', () => {
      initAR();
    });

    function createLine(points, color = '#ff0000') {
      const material = new THREE.LineBasicMaterial({ color: new THREE.Color(color) });
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, material);
      const entity = document.createElement('a-entity');
      entity.setObject3D('mesh', line); // 'mesh' или 'line' — но лучше 'mesh' для совместимости
      return entity;
    }

    async function initAR() {
      const loader = document.getElementById('loader');
      const marker1 = document.getElementById('marker1');
      const marker2 = document.getElementById('marker2');
      const field = document.getElementById('field');
      const boxesContainer = document.getElementById('boxes');

      let model;
      try {
        model = await cocoSsd.load();
        loader.style.display = 'none';
      } catch (e) {
        console.error('Model load failed:', e);
        return;
      }

      const pos1 = new THREE.Vector3();
      const pos2 = new THREE.Vector3();

      function updateField() {
        if (marker1.object3D.visible && marker2.object3D.visible) {
          marker1.object3D.getWorldPosition(pos1);
          marker2.object3D.getWorldPosition(pos2);

          const center = new THREE.Vector3().addVectors(pos1, pos2).multiplyScalar(0.5);
          const sizeX = Math.abs(pos1.x - pos2.x) || 0.1;
          const sizeZ = Math.abs(pos1.z - pos2.z) || 0.1;

          field.setAttribute('position', { x: center.x, y: 0, z: center.z });
          field.setAttribute('scale', { x: sizeX, y: sizeZ, z: 1 });
          field.setAttribute('visible', true);
        } else {
          field.setAttribute('visible', false);
        }
        requestAnimationFrame(updateField);
      }

      updateField();

      async function detectObjects() {
        const video = document.querySelector('video');
        if (!model || !video || video.readyState < 2) {
          requestAnimationFrame(detectObjects);
          return;
        }

        boxesContainer.innerHTML = '';

        if (!field.getAttribute('visible')) {
          requestAnimationFrame(detectObjects);
          return;
        }

        try {
          const predictions = await model.detect(video);
          const fieldPos = field.object3D.position.clone();
          const scale = field.getAttribute('scale');
          const width = scale.x;
          const depth = scale.z;
          const vw = video.videoWidth || 640;
          const vh = video.videoHeight || 480;

          predictions.forEach(pred => {
            const [x, y, w, h] = pred.bbox;

            const x1 = (x / vw - 0.5) * width;
            const x2 = ((x + w) / vw - 0.5) * width;
            const z1 = (0.5 - y / vh) * depth;
            const z2 = (0.5 - (y + h) / vh) * depth;

            const points = [
              new THREE.Vector3(fieldPos.x + x1, 0.01, fieldPos.z + z1),
              new THREE.Vector3(fieldPos.x + x2, 0.01, fieldPos.z + z1),
              new THREE.Vector3(fieldPos.x + x2, 0.01, fieldPos.z + z2),
              new THREE.Vector3(fieldPos.x + x1, 0.01, fieldPos.z + z2),
              new THREE.Vector3(fieldPos.x + x1, 0.01, fieldPos.z + z1)
            ];

            const lineEnt = createLine(points, '#ff0000');
            boxesContainer.appendChild(lineEnt);
          });
        } catch (e) {
          console.warn('Detection error:', e);
        }

        requestAnimationFrame(detectObjects);
      }

      detectObjects();
    }
  </script>
</body>
</html>
