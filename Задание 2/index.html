<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.3.0"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" vr-mode-ui="enabled: false">

      <a-marker type="pattern" url="pattern-LeftUp.patt" id="marker1"></a-marker>

      <a-marker type="pattern" url="pattern-RightDown.patt" id="marker2"></a-marker>

      <a-plane id="field" color="green" opacity="0.5" position="0 0 0" rotation="-90 0 0" visible="false"></a-plane>

      <a-entity camera></a-entity>

      <script>
      const marker1 = document.querySelector('#marker1');
      const marker2 = document.querySelector('#marker2');
      const field = document.querySelector('#field');

      function updateField() {
        const m1Visible = marker1.object3D.visible;
        const m2Visible = marker2.object3D.visible;

        if (m1Visible && m2Visible) {
          const pos1 = marker1.object3D.position.clone();
          const pos2 = marker2.object3D.position.clone();

          // Логируем позиции для отладки
          console.log('Marker1:', pos1.toArray(), 'Marker2:', pos2.toArray());

          const center = new THREE.Vector3()
            .addVectors(pos1, pos2)
            .multiplyScalar(0.5);

          // В AR.js плоскость должна лежать в плоскости маркеров.
          // Обычно маркеры лежат в плоскости XZ (Y — высота), но AR.js использует Y-up.
          // Поэтому ширина — по X, глубина — по Z, а не по Y!
          const width = Math.abs(pos1.x - pos2.x);
          const depth = Math.abs(pos1.z - pos2.z); // ← ВАЖНО: не Y, а Z!

          // Минимальный размер, чтобы плоскость не исчезала
          const minWidth = 0.1;
          const minDepth = 0.1;

          field.setAttribute('position', center);
          field.setAttribute('rotation', '0 0 0'); // X-поворот, чтобы лежала как пол
          field.setAttribute('scale', `${Math.max(width, minWidth)} ${Math.max(depth, minDepth)} 1`);
          field.setAttribute('visible', true);

          console.log('Field updated:', { center, width, depth });
        } else {
          field.setAttribute('visible', false);
        }

        requestAnimationFrame(updateField);
      }

      // Дожидаемся инициализации сцены
      window.addEventListener('load', () => {
        setTimeout(updateField, 1000); // Запускаем с задержкой, чтобы A-Frame успел создать объекты
      });
    </script>

        // Запуск после загрузки DOM
        window.addEventListener('load', initOverlay);
      </script>
    </a-scene>
  </body>
</html>
