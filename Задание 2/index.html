<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" vr-mode-ui="enabled: false">

      <a-marker type="pattern" url="pattern-LeftUp.patt" id="marker1"></a-marker>
      <a-marker type="pattern" url="pattern-RightDown.patt" id="marker2"></a-marker>
      <a-plane id="field" color="green" opacity="0.3" position="0 0 0" rotation="-90 0 0" visible="false"></a-plane>
      <a-entity camera></a-entity>

      <!-- Контейнер для обводки -->
      <a-entity id="boxes"></a-entity>

      <script>
        let model;
        const marker1 = document.querySelector('#marker1');
        const marker2 = document.querySelector('#marker2');
        const field = document.querySelector('#field');
        const boxesContainer = document.querySelector('#boxes');

        async function loadModel() {
          model = await cocoSsd.load();
          console.log('Model loaded');
          detectObjects();
        }

        function updateField() {
          const m1Visible = marker1.object3D.visible;
          const m2Visible = marker2.object3D.visible;
        
          if (m1Visible && m2Visible) {
            const pos1 = marker1.object3D.position;
            const pos2 = marker2.object3D.position;
          
            const center = {
              x: (pos1.x + pos2.x) / 2,
              y: (pos1.y + pos2.y) / 2,
              z: (pos1.z + pos2.z) / 2
            };
          
            const width = Math.abs(pos1.x - pos2.x);
            const depth = Math.abs(pos1.y - pos2.y);
          
            field.setAttribute('position', center);
            field.setAttribute('rotation', '0 0 0'); 
            field.setAttribute('scale', `${width} ${depth} 1`);
            field.setAttribute('visible', true);
          } else {
            field.setAttribute('visible', false);
          }
        
          requestAnimationFrame(updateField);
        }

        updateField();

        async function detectObjects() {
          const video = document.querySelector('video');
          if (!model || !video || video.readyState < 2) {
            requestAnimationFrame(detectObjects);
            return;
          }

          const predictions = await model.detect(video);

          // Очистка предыдущих обводок
          boxesContainer.innerHTML = '';

          predictions.forEach(pred => {
            // Проверяем, попадает ли объект в поле
            if (field.object3D.visible) {
              const fieldPos = field.object3D.position;
              const fieldScale = field.getAttribute('scale');

              const x = (pred.bbox[0] + pred.bbox[2]/2 - video.videoWidth/2) / video.videoWidth * fieldScale.x;
              const z = (pred.bbox[1] + pred.bbox[3]/2 - video.videoHeight/2) / video.videoHeight * fieldScale.z;

              // Добавляем визуальную обводку
              const box = document.createElement('a-box');
              box.setAttribute('position', `${fieldPos.x + x} 0.01 ${fieldPos.z + z}`);
              box.setAttribute('depth', '0.05');
              box.setAttribute('height', '0.05');
              box.setAttribute('width', '0.05');
              box.setAttribute('color', 'red');
              boxesContainer.appendChild(box);
            }
          });

          requestAnimationFrame(detectObjects);
        }

        loadModel();
      </script>
    </a-scene>
  </body>
</html>
