<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.3.0"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" vr-mode-ui="enabled: false">

      <a-marker type="pattern" url="pattern-LeftUp.patt" id="marker1"></a-marker>

      <a-marker type="pattern" url="pattern-RightDown.patt" id="marker2"></a-marker>

      <a-plane id="field" color="green" opacity="0.5" position="0 0 0" rotation="-90 0 0" visible="false"></a-plane>

      <a-entity camera></a-entity>

      <script>
        // --- AR часть (ваша) ---
        const marker1 = document.querySelector('#marker1');
        const marker2 = document.querySelector('#marker2');
        const field = document.querySelector('#field');

        let fieldBounds = null; // { minX, maxX, minY, maxY } в 3D-координатах

        function updateField() {
          const m1Visible = marker1.object3D.visible;
          const m2Visible = marker2.object3D.visible;

          if (m1Visible && m2.Visible) {
            const pos1 = marker1.object3D.position;
            const pos2 = marker2.object3D.position;

            const center = {
              x: (pos1.x + pos2.x) / 2,
              y: (pos1.y + pos2.y) / 2,
              z: (pos1.z + pos2.z) / 2
            };

            const width = Math.abs(pos1.x - pos2.x);
            const depth = Math.abs(pos1.y - pos2.y);

            field.setAttribute('position', center);
            field.setAttribute('rotation', '0 0 0');
            field.setAttribute('scale', `${width} ${depth} 1`);
            field.setAttribute('visible', true);

            // Сохраняем границы поля в 3D
            fieldBounds = {
              minX: Math.min(pos1.x, pos2.x),
              maxX: Math.max(pos1.x, pos2.x),
              minY: Math.min(pos1.y, pos2.y),
              maxY: Math.max(pos1.y, pos2.y)
            };
          } else {
            field.setAttribute('visible', false);
            fieldBounds = null;
          }

          requestAnimationFrame(updateField);
        }

        updateField();

        // --- Computer Vision часть ---
        let model;
        let video;
        let overlayCanvas;
        let overlayCtx;

        // Дожидаемся, пока AR.js создаст видеопоток
        function initOverlay() {
          // Ищем видео AR.js (обычно с id "arjs-video")
          video = document.querySelector('video');
          if (!video) {
            setTimeout(initOverlay, 500);
            return;
          }

          // Создаём canvas поверх сцены
          overlayCanvas = document.createElement('canvas');
          overlayCanvas.style.position = 'absolute';
          overlayCanvas.style.top = '0';
          overlayCanvas.style.left = '0';
          overlayCanvas.style.pointerEvents = 'none';
          overlayCanvas.width = video.videoWidth || window.innerWidth;
          overlayCanvas.height = video.videoHeight || window.innerHeight;
          document.body.appendChild(overlayCanvas);
          overlayCtx = overlayCanvas.getContext('2d');

          // Загружаем модель
          cocoSsd.load().then(net => {
            model = net;
            detectLoop();
          });
        }

        async function detectLoop() {
          if (!model || !video || video.videoWidth === 0) {
            requestAnimationFrame(detectLoop);
            return;
          }

          // Делаем предсказание
          const predictions = await model.detect(video);

          // Очищаем оверлей
          overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

          // Проходим по предсказаниям
          for (const pred of predictions) {
            if (pred.class === 'cup' || pred.class === 'bottle' || pred.score > 0.6) {
              const { bbox } = pred; // [x, y, width, height]

              // --- Преобразуем 2D bbox в 3D координаты?
              // Но у нас нет глубины. Поэтому просто проверяем,
              // находится ли центр bbox в проекции поля.

              // Альтернатива: показываем bbox всегда, но подсвечиваем, если внутри поля
              const centerX = bbox[0] + bbox[2] / 2;
              const centerY = bbox[1] + bbox[3] / 2;

              // Преобразуем пиксели в 3D? → Слишком сложно без калибровки камеры.
              // Вместо этого: если поле видно — показываем маску с подписью "IN FIELD"
              let inField = false;
              if (fieldBounds) {
                // Упрощённо: если поле есть, считаем, что объект "в поле"
                // (в реальности нужно проецировать 3D→2D)
                inField = true;
              }

              // Рисуем рамку
              overlayCtx.strokeStyle = inField ? 'lime' : 'red';
              overlayCtx.lineWidth = 3;
              overlayCtx.strokeRect(...bbox);

              // Рисуем полупрозрачную маску (заливка)
              overlayCtx.fillStyle = inField ? 'lime' : 'red';
              overlayCtx.globalAlpha = inField ? 0.3 : 0.1;
              overlayCtx.fillRect(...bbox);
              overlayCtx.globalAlpha = 1.0;

              // Подпись
              overlayCtx.fillStyle = 'white';
              overlayCtx.font = '16px Arial';
              overlayCtx.fillText(
                `${pred.class} (${(pred.score * 100).toFixed(1)}%) ${inField ? '[IN FIELD]' : ''}`,
                bbox[0],
                bbox[1] > 20 ? bbox[1] - 5 : bbox[1] + 15
              );
            }
          }

          requestAnimationFrame(detectLoop);
        }

        // Запуск после загрузки DOM
        window.addEventListener('load', initOverlay);
      </script>
    </a-scene>
  </body>
</html>
