<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" vr-mode-ui="enabled: false">

        <!-- Маркеры для поля (2 угла) -->
        <a-marker type="pattern" url="pattern-LeftUp.patt" id="marker1"></a-marker>
        <a-marker type="pattern" url="pattern-RightDown.patt" id="marker2"></a-marker>
        
        <!-- Поле (плоскость) -->
        <a-plane id="field" color="green" opacity="0.3" position="0 0 0" rotation="-90 0 0" visible="false"></a-plane>

        <!-- Контейнер для AR-обводки реального объекта -->
        <a-entity id="objectHighlight"></a-entity>

        <a-entity camera></a-entity>

        <script>
            let model;
            const marker1 = document.querySelector('#marker1');
            const marker2 = document.querySelector('#marker2');
            const field = document.querySelector('#field');
            const objectHighlight = document.querySelector('#objectHighlight');

            // Объект, который мы ищем (кружка)
            const TARGET_OBJECT = 'cup';
            let detectedObject = null;

            async function loadModel() {
                model = await cocoSsd.load();
                console.log('Model loaded');
                detectObjects();
            }

            function updateField() {
                const m1Visible = marker1.object3D.visible;
                const m2Visible = marker2.object3D.visible;
            
                if (m1Visible && m2Visible) {
                    const pos1 = marker1.object3D.position;
                    const pos2 = marker2.object3D.position;
                
                    const center = {
                        x: (pos1.x + pos2.x) / 2,
                        y: (pos1.y + pos2.y) / 2,
                        z: (pos1.z + pos2.z) / 2
                    };
                
                    const width = Math.abs(pos1.x - pos2.x);
                    const depth = Math.abs(pos1.z - pos2.z);
                
                    field.setAttribute('position', center);
                    field.setAttribute('scale', `${width} ${depth} 1`);
                    field.setAttribute('visible', true);
                } else {
                    field.setAttribute('visible', false);
                }
            
                requestAnimationFrame(updateField);
            }

            async function detectObjects() {
                const video = document.querySelector('video');
                if (!model || !video || video.readyState < 2) {
                    requestAnimationFrame(detectObjects);
                    return;
                }

                const predictions = await model.detect(video);

                // Очистка предыдущей обводки
                objectHighlight.innerHTML = '';

                // Поиск кружки среди распознанных объектов
                detectedObject = predictions.find(pred => 
                    pred.class === TARGET_OBJECT && pred.score > 0.7
                );

                if (detectedObject && field.object3D.visible) {
                    // Получаем размеры поля
                    const fieldPos = field.object3D.position;
                    const fieldScale = field.getAttribute('scale');
                    const fieldWidth = fieldScale.x;
                    const fieldDepth = fieldScale.z;

                    // Преобразуем координаты 2D (экранные) в 3D (мир AR)
                    // Центр объекта в пикселях
                    const centerX = detectedObject.bbox[0] + detectedObject.bbox[2] / 2;
                    const centerY = detectedObject.bbox[1] + detectedObject.bbox[3] / 2;
                    
                    // Нормализуем координаты от -1 до 1
                    const normalizedX = (centerX / video.videoWidth) * 2 - 1;
                    const normalizedY = (centerY / video.videoHeight) * 2 - 1;
                    
                    // Преобразуем в координаты поля
                    const objectX = fieldPos.x + (normalizedX * fieldWidth / 2);
                    const objectZ = fieldPos.z + (normalizedY * fieldDepth / 2);
                    
                    // Размеры объекта в метрах (оцениваем на основе bounding box)
                    const objectWidth = (detectedObject.bbox[2] / video.videoWidth) * fieldWidth;
                    const objectHeight = (detectedObject.bbox[3] / video.videoHeight) * fieldDepth;

                    // Создаем обводку вокруг реального объекта
                    const highlight = document.createElement('a-entity');
                    
                    // Основная рамка (полая)
                    const frame = document.createElement('a-plane');
                    frame.setAttribute('width', objectWidth);
                    frame.setAttribute('height', objectHeight);
                    frame.setAttribute('color', '#00FF00');
                    frame.setAttribute('opacity', '0.5');
                    frame.setAttribute('position', `0 ${objectHeight/2 + 0.01} 0`);
                    highlight.appendChild(frame);
                    
                    // Текст с названием объекта
                    const text = document.createElement('a-text');
                    text.setAttribute('value', `${detectedObject.class} (${Math.round(detectedObject.score * 100)}%)`);
                    text.setAttribute('color', 'white');
                    text.setAttribute('align', 'center');
                    text.setAttribute('position', `0 ${objectHeight + 0.05} 0`);
                    text.setAttribute('scale', '0.3 0.3 0.3');
                    highlight.appendChild(text);
                    
                    // Устанавливаем позицию обводки
                    highlight.setAttribute('position', `${objectX} 0.01 ${objectZ}`);
                    
                    objectHighlight.appendChild(highlight);

                    console.log(`Объект найден: ${detectedObject.class}`);
                    console.log(`Позиция в AR: x=${objectX.toFixed(2)}, z=${objectZ.toFixed(2)}`);
                    console.log(`Размеры: ${objectWidth.toFixed(2)}m x ${objectHeight.toFixed(2)}m`);
                }

                requestAnimationFrame(detectObjects);
            }

            // Инициализация
            loadModel();
            updateField();

            // Информация для отладки
            setInterval(() => {
                if (detectedObject) {
                    console.log('Объект отслеживается:', detectedObject.class);
                }
            }, 3000);

        </script>
    </a-scene>
</body>
</html>
