<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <style>
        .debug-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
        .light-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255,255,0,0.8);
            color: black;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    
    <div class="debug-panel" id="debugInfo">
        Ожидание маркеров поля...
    </div>
    
    <div class="light-info" id="lightInfo" style="display: none;">
        Источник света активен
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false" vr-mode-ui="enabled: false">

        <!-- Маркеры для поля (2 угла) -->
        <a-marker type="pattern" url="pattern-LeftUp.patt" id="marker1"></a-marker>
        <a-marker type="pattern" url="pattern-RightDown.patt" id="marker2"></a-marker>
        
        <!-- Маркер для источника света (ЗАДАНИЕ 3) -->
        <a-marker type="pattern" url="pattern-Light.patt" id="lightMarker">
            <!-- Визуальное представление источника света -->
            <a-entity id="lightVisual">
                <!-- Основание лампы -->
                <a-cylinder radius="0.03" height="0.02" color="#555555" position="0 0.01 0"></a-cylinder>
                
                <!-- Ножка лампы -->
                <a-cylinder radius="0.01" height="0.15" color="#333333" position="0 0.09 0"></a-cylinder>
                
                <!-- Абажур/плафон -->
                <a-cone radius-bottom="0.05" radius-top="0.02" height="0.1" color="#FFD700" 
                        position="0 0.2 0" rotation="0 0 0"></a-cone>
                
                <!-- Светящийся шар -->
                <a-sphere radius="0.02" color="#FFFF00" position="0 0.15 0">
                    <a-animation attribute="scale"
                                dur="2000"
                                direction="alternate"
                                repeat="indefinite"
                                from="1 1 1"
                                to="1.3 1.3 1.3"></a-animation>
                </a-sphere>
            </a-entity>
            
            <!-- Фактический источник света A-Frame -->
            <a-light id="directionalLight"
                    type="directional"
                    color="#FFFFCC"
                    intensity="0.8"
                    position="0 0.3 0"
                    castShadow="true">
            </a-light>
        </a-marker>
        
        <!-- Поле (плоскость) -->
        <a-plane id="field" color="green" opacity="0.3" position="0 0 0" rotation="0 0 0" visible="false"></a-plane>

        <!-- Контейнер для всех AR-обводок объектов -->
        <a-entity id="objectHighlights"></a-entity>
        
        <!-- Контейнер для лучей света (визуализация) -->
        <a-entity id="lightRays"></a-entity>

        <a-entity camera></a-entity>

        <script>
            let model;
            const marker1 = document.querySelector('#marker1');
            const marker2 = document.querySelector('#marker2');
            const lightMarker = document.querySelector('#lightMarker');
            const field = document.querySelector('#field');
            const objectHighlights = document.querySelector('#objectHighlights');
            const lightRays = document.querySelector('#lightRays');
            const debugInfo = document.querySelector('#debugInfo');
            const lightInfo = document.querySelector('#lightInfo');

            // Классы объектов, которые может распознать COCO-SSD
            const ALLOWED_CLASSES = [
                'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck',
                'boat', 'traffic light', 'fire hydrant', 'stop sign', 'parking meter',
                'bench', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow', 'elephant',
                'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie',
                'suitcase', 'frisbee', 'skis', 'snowboard', 'sports ball', 'kite',
                'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket',
                'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl',
                'banana', 'apple', 'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog',
                'pizza', 'donut', 'cake', 'chair', 'couch', 'potted plant', 'bed',
                'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard',
                'cell phone', 'microwave', 'oven', 'toaster', 'sink', 'refrigerator',
                'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'
            ];

            // Цвета для разных типов объектов
            const CLASS_COLORS = {
                'cup': '#FF5722',
                'bottle': '#4CAF50',
                'book': '#2196F3',
                'cell phone': '#9C27B0',
                'laptop': '#FF9800',
                'person': '#F44336',
                'chair': '#795548',
                'default': '#00BCD4'
            };

            let detectedObjects = [];
            let lightPosition = { x: 0, y: 0, z: 0 };
            let lightRotation = { x: 0, y: 0, z: 0 };
            let isLightActive = false;

            async function loadModel() {
                model = await cocoSsd.load();
                console.log('Модель COCO-SSD загружена');
                detectObjects();
            }

            function updateField() {
                const m1Visible = marker1.object3D.visible;
                const m2Visible = marker2.object3D.visible;
            
                if (m1Visible && m2Visible) {
                    const pos1 = marker1.object3D.position;
                    const pos2 = marker2.object3D.position;
                
                    const center = {
                        x: (pos1.x + pos2.x) / 2,
                        y: (pos1.y + pos2.y) / 2,
                        z: (pos1.z + pos2.z) / 2
                    };
                
                    const width = Math.abs(pos1.x - pos2.x);
                    const depth = Math.abs(pos1.y - pos2.y);
                
                    field.setAttribute('position', `${center.x} ${center.y} ${center.z}`);
                    field.setAttribute('scale', `${width} ${depth} 1`);
                    field.setAttribute('visible', true);

                    // Обновляем информацию для отладки
                    debugInfo.innerHTML = `
                        <strong>Поле активно</strong><br>
                        Центр: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})<br>
                        Размеры: ${width.toFixed(2)} x ${depth.toFixed(2)} м<br>
                        Объектов: ${detectedObjects.length}<br>
                        Свет: ${isLightActive ? 'ВКЛ' : 'ВЫКЛ'}
                    `;
                } else {
                    field.setAttribute('visible', false);
                    debugInfo.innerHTML = 'Ожидание обоих маркеров поля...';
                }
            
                requestAnimationFrame(updateField);
            }

            function updateLight() {
                if (lightMarker.object3D.visible) {
                    // Получаем позицию и вращение маркера света
                    const pos = lightMarker.object3D.position;
                    const rot = lightMarker.object3D.rotation;
                    
                    lightPosition = { x: pos.x, y: pos.y, z: pos.z };
                    lightRotation = { 
                        x: rot.x * (180 / Math.PI), 
                        y: rot.y * (180 / Math.PI), 
                        z: rot.z * (180 / Math.PI) 
                    };
                    
                    isLightActive = true;
                    lightInfo.style.display = 'block';
                    lightInfo.innerHTML = `
                        <strong>Источник света активен</strong><br>
                        Позиция: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})<br>
                        Угол: ${lightRotation.y.toFixed(1)}°
                    `;
                    
                    // Обновляем визуализацию лучей
                    updateLightRays();
                } else {
                    isLightActive = false;
                    lightInfo.style.display = 'none';
                    lightRays.innerHTML = '';
                }
                
                requestAnimationFrame(updateLight);
            }

            function updateLightRays() {
                if (!isLightActive) return;
                
                // Очищаем предыдущие лучи
                lightRays.innerHTML = '';
                
                // Создаем лучи света (визуализация)
                for (let i = 0; i < 8; i++) {
                    const angle = (i * 45) * Math.PI / 180;
                    const rayLength = 0.5;
                    
                    const ray = document.createElement('a-entity');
                    
                    // Линия луча
                    const line = document.createElement('a-cylinder');
                    line.setAttribute('radius', '0.005');
                    line.setAttribute('height', rayLength);
                    line.setAttribute('color', '#FFFF00');
                    line.setAttribute('opacity', '0.4');
                    line.setAttribute('position', `0 ${rayLength/2} 0`);
                    line.setAttribute('rotation', `0 0 ${90}`);
                    
                    ray.appendChild(line);
                    
                    // Позиционируем луч
                    const x = Math.sin(angle) * 0.1;
                    const z = Math.cos(angle) * 0.1;
                    
                    ray.setAttribute('position', `${lightPosition.x + x} ${lightPosition.y} ${lightPosition.z + z}`);
                    
                    // Поворачиваем луч в направлении света
                    ray.setAttribute('rotation', `0 ${-lightRotation.y} 0`);
                    
                    lightRays.appendChild(ray);
                }
            }

            function getColorForClass(className) {
                return CLASS_COLORS[className] || CLASS_COLORS['default'];
            }

            function isPointInField(pointX, pointZ, fieldPos, fieldScale) {
                const halfWidth = fieldScale.x / 2;
                const halfDepth = fieldScale.z / 2;
                
                return (pointX >= fieldPos.x - halfWidth && pointX <= fieldPos.x + halfWidth &&
                        pointZ >= fieldPos.z - halfDepth && pointZ <= fieldPos.z + halfDepth);
            }

            function calculateLightingForObject(objPosition) {
                if (!isLightActive) return { intensity: 0.3, color: '#888888' };
                
                // Рассчитываем расстояние до источника света
                const dx = objPosition.x - lightPosition.x;
                const dz = objPosition.z - lightPosition.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                
                // Рассчитываем угол между светом и объектом
                const angleToLight = Math.atan2(dz, dx) * (180 / Math.PI);
                const lightAngle = lightRotation.y;
                const angleDiff = Math.abs(angleToLight - lightAngle);
                
                // Интенсивность света зависит от расстояния и угла
                let intensity = 1.0;
                
                // Затухание с расстоянием
                intensity *= Math.max(0, 1 - distance / 2);
                
                // Затухание с углом (направленный свет)
                const angleFactor = Math.max(0, 1 - Math.abs(angleDiff) / 90);
                intensity *= angleFactor;
                
                // Цвет меняется в зависимости от интенсивности
                const colorIntensity = Math.floor(intensity * 255);
                const color = `rgb(${colorIntensity}, ${colorIntensity}, ${Math.min(200, colorIntensity)})`;
                
                return { 
                    intensity: Math.max(0.1, intensity),
                    color: color
                };
            }

            async function detectObjects() {
                const video = document.querySelector('video');
                if (!model || !video || video.readyState < 2) {
                    requestAnimationFrame(detectObjects);
                    return;
                }

                // Распознаем объекты на кадре
                const predictions = await model.detect(video);
                
                // Очищаем предыдущие обводки
                objectHighlights.innerHTML = '';
                detectedObjects = [];

                // Фильтруем объекты с высокой уверенностью
                const validPredictions = predictions.filter(pred => pred.score > 0.6);

                if (validPredictions.length > 0 && field.object3D.visible) {
                    const fieldPos = field.object3D.position;
                    const fieldScale = field.getAttribute('scale');
                    
                    validPredictions.forEach((pred, index) => {
                        // Преобразуем координаты 2D в 3D
                        const centerX = pred.bbox[0] + pred.bbox[2] / 2;
                        const centerY = pred.bbox[1] + pred.bbox[3] / 2;
                        
                        // Нормализуем координаты
                        const normalizedX = (centerX / video.videoWidth) * 2 - 1;
                        const normalizedY = (centerY / video.videoHeight) * 2 - 1;
                        
                        // Преобразуем в координаты мира AR
                        const worldX = fieldPos.x + (normalizedX * fieldScale.x / 2);
                        const worldZ = fieldPos.z + (normalizedY * fieldScale.z / 2);
                        
                        // Проверяем, находится ли объект внутри поля
                        if (isPointInField(worldX, worldZ, fieldPos, fieldScale)) {
                            detectedObjects.push({
                                class: pred.class,
                                score: pred.score,
                                position: { x: worldX, z: worldZ },
                                bbox: pred.bbox
                            });

                            // Размеры объекта
                            const objectWidth = (pred.bbox[2] / video.videoWidth) * fieldScale.x * 0.8;
                            const objectHeight = (pred.bbox[3] / video.videoHeight) * fieldScale.z * 0.8;
                            
                            // Базовый цвет для этого класса объектов
                            const baseColor = getColorForClass(pred.class);
                            
                            // Рассчитываем освещение для этого объекта
                            const lighting = calculateLightingForObject({ x: worldX, z: worldZ });
                            
                            // Создаем обводку
                            const highlight = document.createElement('a-entity');
                            
                            // Плоскость-подсветка с учетом освещения
                            const plane = document.createElement('a-plane');
                            plane.setAttribute('width', objectWidth);
                            plane.setAttribute('height', objectHeight);
                            plane.setAttribute('color', lighting.color);
                            plane.setAttribute('opacity', '0.3');
                            plane.setAttribute('position', `0 0.01 0`);
                            plane.setAttribute('rotation', '-90 0 0');
                            highlight.appendChild(plane);
                            
                            // Рамка с изменяющейся яркостью
                            const frame = document.createElement('a-ring');
                            frame.setAttribute('radius-inner', objectWidth/2 - 0.02);
                            frame.setAttribute('radius-outer', objectWidth/2);
                            frame.setAttribute('color', baseColor);
                            frame.setAttribute('opacity', lighting.intensity);
                            frame.setAttribute('position', `0 0.02 0`);
                            frame.setAttribute('rotation', '-90 0 0');
                            highlight.appendChild(frame);
                            
                            // Индикатор освещенности
                            const lightIndicator = document.createElement('a-circle');
                            lightIndicator.setAttribute('radius', '0.03');
                            lightIndicator.setAttribute('color', lighting.intensity > 0.5 ? '#FFFF00' : '#888888');
                            lightIndicator.setAttribute('opacity', '0.7');
                            lightIndicator.setAttribute('position', `${objectWidth/2 + 0.05} 0.03 0`);
                            lightIndicator.setAttribute('rotation', '-90 0 0');
                            highlight.appendChild(lightIndicator);
                            
                            // Текст с информацией
                            const text = document.createElement('a-text');
                            text.setAttribute('value', `${pred.class}\n${Math.round(pred.score * 100)}%`);
                            text.setAttribute('color', lighting.intensity > 0.5 ? 'white' : '#AAAAAA');
                            text.setAttribute('align', 'center');
                            text.setAttribute('position', `0 0.05 0`);
                            text.setAttribute('scale', '0.2 0.2 0.2');
                            text.setAttribute('rotation', '90 0 0');
                            highlight.appendChild(text);
                            
                            // Устанавливаем позицию
                            highlight.setAttribute('position', `${worldX} 0.01 ${worldZ}`);
                            
                            objectHighlights.appendChild(highlight);
                        }
                    });
                }

                // Ограничиваем частоту распознавания для производительности
                setTimeout(() => {
                    requestAnimationFrame(detectObjects);
                }, 100);
            }

            // Инициализация
            window.onload = function() {
                loadModel();
                updateField();
                updateLight();
                
                console.log('Система готова к работе');
                console.log('Используйте 3 маркера:');
                console.log('1. pattern-LeftUp.patt - левый верхний угол поля');
                console.log('2. pattern-RightDown.patt - правый нижний угол поля');
                console.log('3. pattern-Light.patt - источник света');
            };

        </script>
    </a-scene>
</body>
</html>
